name: Release to Google Play

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate tag format
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Tag: $TAG"

          # Validate CalVer format: YYYY.MM.PATCH
          if [[ ! $TAG =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]]; then
            echo "Error: Tag must be in CalVer format: YYYY.MM.PATCH (e.g., 2025.12.1)"
            exit 1
          fi

          # Extract components
          YEAR=$(echo $TAG | cut -d. -f1)
          MONTH=$(echo $TAG | cut -d. -f2)
          PATCH=$(echo $TAG | cut -d. -f3)

          # Validate year and month
          CURRENT_YEAR=$(date +%Y)
          if [[ $YEAR -lt 2024 || $YEAR -gt $((CURRENT_YEAR + 1)) ]]; then
            echo "Error: Year must be reasonable (2024-$((CURRENT_YEAR + 1)))"
            exit 1
          fi

          if [[ $MONTH -lt 1 || $MONTH -gt 12 ]]; then
            echo "Error: Month must be 1-12"
            exit 1
          fi

          # Calculate versionCode: YYYYMMPATCH (e.g., 2025121 for 2025.12.1)
          VERSION_CODE="${YEAR}$(printf '%02d' $MONTH)${PATCH}"

          echo "VERSION_NAME=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

          echo "Version Name: $TAG"
          echo "Version Code: $VERSION_CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release AAB
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true

      - name: Upload to Google Play (Internal Track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: xyz.chrismiller.crochetti
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
